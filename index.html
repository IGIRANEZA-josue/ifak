<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Set data-theme before first paint — no flash of the wrong theme.
         Priority: explicit choice in localStorage, else the OS preference. */
      (function () {
        try {
          var t = localStorage.getItem('ifak-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta
      name="description"
      content="Official website of IFAK — Institut de Formation Apostolique de Kimihurura, a Catholic Salesian Don Bosco school in Kimihurura, Gasabo, Kigali. News, events, announcements and admissions."
    />
    <meta name="theme-color" content="#16324a" />
    <link rel="icon" type="image/jpeg" href="https://ifakdonbosco.ac.rw/wp-content/uploads/2022/09/Logo.jpeg" />
    <link rel="alternate icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>IFAK | Institut de Formation Apostolique de Kimihurura — Don Bosco School, Kigali</title>
    <style>
      /* Boot splash (Instagram-style): painted instantly, no JS, no network needed.
         Inline here so it works before any bundle or font is loaded. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #ffffff;
        gap: 1.15rem;
        opacity: 1; visibility: visible;
        transition: opacity 320ms ease, visibility 320ms ease;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #splash.splash-out { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-mark {
        width: 96px; height: 96px; display: block;
        object-fit: contain; background: #fff; border-radius: 16px; padding: 6px;
        box-shadow: 0 2px 12px rgba(18, 40, 63, 0.28);
      }
      .splash-name {
        margin: 0; font-size: 1.55rem; font-weight: 700; letter-spacing: 0.34em;
        color: #16324a; text-indent: 0.34em; /* optical center for tracked caps */
      }
      .splash-sub {
        margin: -0.35rem 0 0; font-size: 0.58rem; font-weight: 600;
        letter-spacing: 0.22em; text-transform: uppercase; color: #5d6b7a;
      }
      .splash-spinner {
        width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box;
        border: 3px solid #e3e6ea; border-top-color: #16324a;
        animation: splash-spin 0.8s linear infinite;
        margin-top: 0.35rem;
      }
      .splash-foot {
        position: absolute; bottom: 2.2rem; left: 1rem; right: 1rem; text-align: center;
        font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
        color: #9aa5b1; font-weight: 600;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .splash-spinner { animation: none; }
        #splash { transition: opacity 150ms linear, visibility 150ms linear; }
      }
      /* Dark boot splash (follows the pre-paint data-theme above) */
      :root[data-theme="dark"] #splash { background: #10151d; }
      :root[data-theme="dark"] .splash-name { color: #e8edf3; }
      :root[data-theme="dark"] .splash-sub { color: #96a5b4; }
      :root[data-theme="dark"] .splash-spinner { border-color: #232e3a; border-top-color: #8fb6d9; }
      :root[data-theme="dark"] .splash-foot { color: #5d6b7a; }
      :root[data-theme="dark"] .splash-mark { background: #10151d; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5); }
    </style>
    <noscript><style>#splash { display: none; }</style></noscript>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading IFAK website">
      <img
        class="splash-mark"
        src="https://ifakdonbosco.ac.rw/wp-content/uploads/2022/09/Logo.jpeg"
        alt="IFAK — Institut de Formation Apostolique de Kimihurura logo"
        width="96" height="96"
        onerror="this.onerror=null;this.style.visibility='hidden'"
      />
      <p class="splash-name">IFAK</p>
      <p class="splash-sub">Don Bosco · Kimihurura</p>
      <span class="splash-spinner" aria-hidden="true"></span>
      <p class="splash-foot">Institut de Formation Apostolique de Kimihurura</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
